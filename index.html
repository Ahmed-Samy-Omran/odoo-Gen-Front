<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ai_icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Odoo Gen - AI-powered Odoo module generator" />
    <title>Odoo Gen - AI Module Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html[data-theme='carbon'] { color-scheme: dark; }
      html[data-theme='paper'] { color-scheme: light; }
      html[data-theme='aurora'] { color-scheme: dark; }
    </style>
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('odoo_theme');
          if (t !== 'paper' && t !== 'aurora') t = 'carbon';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'carbon';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
